# Cache
cache=yes
cache-secs=900
demuxer-max-back-bytes=75MiB
demuxer-max-bytes=150MiB
stream-buffer-size=16MiB
gpu-shader-cache-dir=~~/cache/shaders
icc-cache-dir=~~/cache/icc

# GPU API
gpu-api=d3d11                            
d3d11-flip=yes                           
d3d11-exclusive-fs=no                    
gpu-context=d3d11
hr-seek-framedrop=no

# Video
profile=gpu-hq
vo=gpu-next
hwdec=nvdec
# Dither optimized for gpu-next
dither=fruit
dither-depth=auto
temporal-dither-period=1
# Better scaling and antiring
scale-antiring=0.7
cscale-antiring=0.7
dscale-antiring=0.7
correct-downscaling=yes
sigmoid-upscaling=yes				# Prevents ringing/aliasing artifacts during upscaling.

# MISC
osc=no
keep-open

#############
# Subtitles #
#############
demuxer-mkv-subtitle-preroll=yes
demuxer-mkv-subtitle-preroll-secs=2

sub-auto=fuzzy
sub-file-paths-append=ass:srt:sub:subs:subtitles
embeddedfonts=yes
sub-fix-timing=no

# --- IMPROVED FORCE INTO BLACK BARS ---
sub-use-margins=yes
sub-ass-force-margins=yes
# CHANGE: 'force' is mandatory to move .ass subtitles outside the video pixels
sub-ass-override=yes           
blend-subtitles=no

# 1. FIX FOR TEXT SUBS (.ass, .srt)
# Prevents ASS subtitles from stretching with anamorphic video (depricated)
# sub-ass-vsfilter-aspect-compat=no

# 2. SCALING
# Helps subtitles scale properly when you resize the window
sub-scale-with-window=yes

# Styling for SRT/unstyled subs
sub-font="Source Sans Pro Semibold"
sub-font-size=36
sub-color="#FFFFFFFF"
sub-border-color="#FF262626"
sub-border-size=3.2
sub-shadow-offset=1
sub-shadow-color="#33000000"
sub-spacing=0.5

# Pushes the text to the absolute bottom of the black bars
sub-pos=100

[High-Quality]
profile-desc=Live Action / Non-Anime (TV-like Upscaling)

scale=ewa_lanczossharp
cscale=spline36
dscale=mitchell
correct-downscaling=yes

# Light deband (DVD-safe)
deband=yes
deband-iterations=1
deband-threshold=24
deband-range=12
deband-grain=16


# AI-style upscaling chain (TV-like)
glsl-shaders-set="~~/shaders/FSRCNNX_x2_16-0-4-1.glsl;~~/shaders/KrigBilateral.glsl;~~/shaders/adaptive-sharpen-modern-1080p.glsl"

[HQ-SD-Clean]
profile-desc=Non-Anime <720p (Clean SD)

###########
# SCALING #
###########
scale=ewa_lanczossharp
cscale=spline36
dscale=mitchell
correct-downscaling=yes

###########
# DEBAND  #
###########
deband=yes
deband-iterations=1
deband-threshold=26
deband-range=16
deband-grain=20

###########
# DENOISE #
###########
# Mild, safe temporal denoise
vf=hqdn3d=0:0:4:4

###########
# SHADERS #
###########
glsl-shaders-set="~~/shaders/SSimSuperRes.glsl;~~/shaders/adaptive-sharpen-modern-SD.glsl"

[HQ-SD-Texture]
profile-desc=Non-Anime <720p (Texture Masked SD)

###########
# SCALING #
###########
scale=ewa_lanczossharp
cscale=spline36
dscale=mitchell
correct-downscaling=yes


###########
# DEBAND  #
###########
# Lower cleanup, higher grain to mask blocks
deband=yes
deband-iterations=1
deband-threshold=22
deband-range=14
deband-grain=40

###########
# SHADERS #
###########
# No denoise, no sharpen — texture masking only
glsl-shaders-set="~~/shaders/SSimSuperRes.glsl"

[HQ-HD-NNEDI]
profile-desc=Non-Anime 576p–<1080p (NNEDI Geometry Focus)

scale=ewa_lanczossharp
cscale=spline36
dscale=mitchell
correct-downscaling=yes

# Same deband as High-Quality
deband=yes
deband-iterations=1
deband-threshold=24
deband-range=12
deband-grain=16

# NNEDI geometry upscaling (HOOK version)
glsl-shaders-set="~~/shaders/nnedi3-nns64-win8x4.hook;~~/shaders/KrigBilateral.glsl;~~/shaders/adaptive-sharpen-modern-HD.glsl"




[Mid-Quality]
profile-desc=Optimized for 4K/HFR
scale=spline36
cscale=spline36
dscale=mitchell
deband=yes
glsl-shaders-set="~~/shaders/FSRCNNX_x2_8-0-4-1.glsl;~~/shaders/KrigBilateral.glsl;~~/shaders/SSimSuperRes.glsl;~~/shaders/adaptive-sharpen-modern-1080p.glsl"

[Low-Quality]
profile-desc=Performance Fallback
scale=bilinear
cscale=bilinear
deband=no
glsl-shaders-set="~~/shaders/adaptive-sharpen-modern-1080p.glsl"


[HDR-High-Quality]
profile-cond=p["video-params/sig-peak"] > 1

# --- CORE ---
vo=gpu-next
gpu-api=d3d11
gpu-context=d3d11
msg-level=ffmpeg/video=fatal
hwdec=d3d11va           


# --- FALLBACK TONE MAPPING (For SDR Monitors) ---
target-colorspace-hint=no
target-trc=srgb
tone-mapping=spline
gamut-mapping-mode=auto
hdr-compute-peak=yes
hdr-peak-percentile=99.8
hdr-contrast-recovery=0.30
hdr-peak-decay-rate=100.0

# --- DOLBY VISION ---
tone-mapping-visualize=no

[anime-shaders]
profile-desc=Anime only (line art + clean gradients)

# --- Scaling ---
scale=ewa_lanczossharp
cscale=spline36
dscale=mitchell

# --- Debanding (anime tuned) ---
deband=yes
deband-iterations=2
deband-threshold=28
deband-range=14
deband-grain=4

#glsl-shaders="~~/shaders/Ani4Kv2_ArtCNN_C4F32_i2.glsl"
# Anime4K: Mode C+A (HQ)
#glsl-shaders="~~/shaders/Anime4K_Clamp_Highlights.glsl;~~/shaders/Anime4K_Upscale_Denoise_CNN_x2_VL.glsl;~~/shaders/Anime4K_AutoDownscalePre_x2.glsl;~~/shaders/Anime4K_AutoDownscalePre_x4.glsl;~~/shaders/Anime4K_Restore_CNN_M.glsl;~~/shaders/Anime4K_Upscale_CNN_x2_M.glsl"

# --- External audio auto-detection ---
# Automatically load same-named external audio files (e.g. movie.mpa alongside movie.mkv)
# "fuzzy" matches files whose name contains the video's base name
audio-file-auto=fuzzy