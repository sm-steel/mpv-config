# autoload.lua configuration

# Auto-load video files from the same directory into the playlist
# This enables "play next file" behavior
videos=yes

# Don't add audio files to the playlist (they are not videos to queue up)
audio=no

# Don't auto-load images
images=no

# Natural alphanumeric sort (e.g. ep2 before ep10)
# (handled automatically by the script's alphanumsort)

# Ignore hidden files (starting with .)
ignore_hidden=yes
